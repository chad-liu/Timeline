name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://liu-timeline.pages.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # 專案不存在時建立；已存在時這一步會失敗，忽略即可
      - run: npx --yes wrangler@4 pages project create liu-timeline --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx --yes wrangler@4 pages deploy dist --project-name=liu-timeline --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 舊網址 chad-liu.github.io/Timeline/ 只留轉址頁與 people.json（books 網站已全部改用新網址，不再上傳 data/ 圖片）
      - run: |
          mkdir legacy
          cp redirect/index.html redirect/404.html dist/people.json legacy/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legacy

  github-pages-redirect:
    needs: cloudflare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
